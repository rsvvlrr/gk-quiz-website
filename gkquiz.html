<!DOCTYPE html>
<html>
<head>
    <title>University GK Quiz Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #1e3c72;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #16325c;
        }

        .question-box {
            margin-top: 20px;
        }

        .question-number {
            font-weight: bold;
            color: #1e3c72;
        }

        .options label {
            display: block;
            padding: 10px;
            margin: 6px 0;
            background: #f2f2f2;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .options label:hover {
            background: #d9e6ff;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: #1e3c72;
        }

        .result {
            text-align: center;
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
            color: #1e3c72;
        }

        #quizPage {
            display: none;
        }

        .nav-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

<div class="container" id="welcomePage">
    <h1>University General Knowledge Test</h1>
    <div class="subtitle">Enter your details to begin the assessment</div>

    <input type="text" id="studentName" placeholder="Full Name">
    <input type="text" id="studentId" placeholder="Student ID">
    <input type="text" id="course" placeholder="Course / Department">

    <button onclick="startQuiz()">Start Test</button>
</div>

<div class="container" id="quizPage">

    <div class="top-bar">
        <div>Time Left: <span id="time">180</span>s</div>
        <div>Question <span id="qNumber">1</span> / 10</div>
    </div>

    <div class="question-box" id="questionBox"></div>

    <div class="nav-buttons">
        <button onclick="prevQuestion()">Previous</button>
        <button onclick="nextQuestion()">Next</button>
    </div>

    <div class="result" id="result"></div>
</div>

<script>

const quizData = [
{q:"What is the capital of Canada?", o:["Toronto","Ottawa","Vancouver","Montreal"], a:"Ottawa"},
{q:"Which element has atomic number 1?", o:["Helium","Hydrogen","Oxygen","Nitrogen"], a:"Hydrogen"},
{q:"Who discovered gravity?", o:["Newton","Einstein","Galileo","Tesla"], a:"Newton"},
{q:"Which country hosted FIFA 2022?", o:["Brazil","Qatar","Russia","France"], a:"Qatar"},
{q:"What is the largest desert?", o:["Sahara","Gobi","Arctic","Thar"], a:"Sahara"},
{q:"Which organ pumps blood?", o:["Brain","Liver","Heart","Lungs"], a:"Heart"},
{q:"Who wrote 'Hamlet'?", o:["Shakespeare","Wordsworth","Dickens","Milton"], a:"Shakespeare"},
{q:"Speed of light is?", o:["3x10^8 m/s","3x10^6 m/s","3x10^5 km/s","1x10^8 m/s"], a:"3x10^8 m/s"},
{q:"Which is smallest prime number?", o:["0","1","2","3"], a:"2"},
{q:"Which gas is most abundant in atmosphere?", o:["Oxygen","Hydrogen","Nitrogen","Carbon Dioxide"], a:"Nitrogen"}
];

let current = 0;
let answers = new Array(quizData.length);
let student = "";
let timerInterval;

function startQuiz(){
    let name = document.getElementById("studentName").value;
    let id = document.getElementById("studentId").value;
    let course = document.getElementById("course").value;

    if(name=="" || id=="" || course==""){
        alert("Please fill all details");
        return;
    }

    student = name;

    document.getElementById("welcomePage").style.display="none";
    document.getElementById("quizPage").style.display="block";

    loadQuestion();
    startTimer();
}

function loadQuestion(){
    let data = quizData[current];
    document.getElementById("qNumber").innerText = current+1;

    let html = `<div class="question-number">Q${current+1}. ${data.q}</div><div class="options">`;

    data.o.forEach(opt=>{
        html+=`<label><input type="radio" name="option" value="${opt}"
        ${answers[current]===opt?"checked":""}> ${opt}</label>`;
    });

    html+="</div>";
    document.getElementById("questionBox").innerHTML = html;
}

function saveAnswer(){
    let selected = document.querySelector('input[name="option"]:checked');
    if(selected){
        answers[current]=selected.value;
    }
}

function nextQuestion(){
    saveAnswer();
    if(current < quizData.length-1){
        current++;
        loadQuestion();
    } else {
        showResult();
    }
}

function prevQuestion(){
    saveAnswer();
    if(current>0){
        current--;
        loadQuestion();
    }
}

function showResult(){
    clearInterval(timerInterval);
    let score=0;

    answers.forEach((ans,i)=>{
        if(ans===quizData[i].a) score++;
    });

    document.getElementById("questionBox").innerHTML="";
    document.querySelector(".nav-buttons").style.display="none";

    document.getElementById("result").innerHTML=
    "Student: "+student+"<br>Final Score: "+score+" / 10";
}

function startTimer(){
    let time=180;
    timerInterval=setInterval(()=>{
        time--;
        document.getElementById("time").innerText=time;
        if(time<=0){
            clearInterval(timerInterval);
            showResult();
        }
    },1000);
}

</script>

</body>
</html>
